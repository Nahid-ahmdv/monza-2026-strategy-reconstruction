# =====================================================================================
# Monza 2026 - Antonelli Race Strategy Reconstruction
# Model configuration: an independent reconstruction of Ruth Buscombe's pre-race strategy model
# =====================================================================================
#
# Every parameter is recorded as   {value, status, source, note}   (and optionally role)
#
#   status:
#     published      - stated explicitly by Ruth Buscombe (article text or graphic)
#     reconstructed  - recomputed from public timing data with Ruth's stated method
#     evidence       - taken from independent external evidence (FIA rules, TUM fitted
#                      Monza parameters, 2025 Monza timing data)
#     assumed        - our own modelling choice where no direct evidence exists
#
#   role:
#     operative (default) - read by the simulator and used; changing it changes behaviour
#     fixed               - read and VALIDATED: the code implements exactly one value, and the loader rejects any
#                           other value instead of ignoring it (racesim.config.FIXED_CHOICES / validate_params)
#
#   source: a key into the `sources` table at the bottom of this file.
#
# DO NOT EDIT THIS FILE TO IMPROVE AGREEMENT WITH RUTH'S RESULTS. Sensitivity variants are created in code
# (racesim.config.variant, also validated) and are always labelled as such. No entry is merely documentary:
# every entry is either operative or fixed-and-validated. The configuration was written with Ruth's published
# predictions known, so the comparison with them is not a blind test.
# =====================================================================================

meta:
  id: monza_2026
  target_driver: ANT
  written_on: "2026-10-08"
  description: >-
    Full-field (22-car), lap-wise, deterministic race model implementing the rules Ruth Buscombe disclosed in
    'The model'. Elapsed race time is physical (never decreases), passes are time-feasible, the hard warm-up is
    paid on the first green lap of a set, Ruth's Safety-Car stop rule is checked throughout the cheap-stop
    window, and the Safety-Car period is a window of the shared race clock, identical for every car whatever
    lap it is on.

race:
  total_laps:
    value: 53
    status: published
    source: ruth_article
    note: "'53 laps, 22 cars'."
  reference_lap_time_s:
    value: 84.0
    status: assumed
    source: none
    note: >-
      Clean-air lap of a car with pace gap 0 on a new hard tyre with an empty tank. In a race WITHOUT a Safety Car
      it is a common offset that cancels in every position and gap (verified by an invariance test). It does NOT
      cancel under a Safety Car: the Safety-Car and full-course-yellow lap times are multiples of it, and it
      converts racing-speed time into lap distance.
  sc_lap_time_factor:
    value: 1.6
    status: evidence
    source: tum_monza_params
    note: >-
      Lap time of the Safety Car (and of the car directly behind it) = factor x reference lap (TUM
      'mult_t_lap_sc').
  fcy_lap_time_factor:
    value: 1.4
    status: evidence
    source: tum_monza_params
    note: >-
      Full-course-yellow delta pace (TUM 'mult_t_lap_fcy'): the fastest lap a car may do while the race is
      neutralised. Used for every neutralised part of a lap, including the rest of the lap during which the
      Safety Car is deployed, and identical for every car (the FIA delta is not car-specific). Because it is
      faster than the Safety Car (1.4 < 1.6), cars catch the queue at 0.2 x 84 = 16.8 s per lap.

fuel:
  effect_s_per_lap:
    value: 0.07
    status: published
    source: ruth_article
    note: >-
      Lap time falls 0.07 s for each lap of fuel burnt. Identical for every car, so in a race without a Safety Car
      it changes absolute lap times only (verified by an invariance test). Under a Safety Car it also changes how
      much distance a car covers before and after the neutralisation, so it is not exactly neutral there.

tyres:
  # offset_s: time relative to a NEW hard tyre; deg_s_per_lap: linear loss per lap of age;
  # warmup_s: extra time on the first lap after the set is fitted at a pit stop;
  # max_life_laps: longest stint we allow the compound to run (used by the Safety-Car rule
  #                "take the cheap stop if the next compound can reach the flag").
  HARD:
    offset_s: {value: 0.0, status: published, source: ruth_article, note: "Reference compound."}
    deg_s_per_lap: {value: 0.015, status: published, source: ruth_article, note: "'hard 0.015 s/lap'."}
    warmup_s: {value: 0.6, status: published, source: ruth_article, note: "'hard 0.6s slower on its first lap'."}
    max_life_laps:
      value: 52
      status: published
      source: ruth_article
      note: >-
        Ruth's explicit premise: the lap-1 stop 'needs the hard to do 52 laps, which last
        year it did' (Ocon ran 51 laps on the hard at Monza 2025, confirmed in 2025 timing).
  MEDIUM:
    offset_s: {value: -0.20, status: published, source: ruth_article, note: "'medium 0.20s a lap quicker than the hard when new'."}
    deg_s_per_lap: {value: 0.05, status: published, source: ruth_article, note: "'medium 0.05'."}
    warmup_s: {value: 0.0, status: assumed, source: ruth_article, note: "Ruth states a warm-up penalty for the hard only."}
    max_life_laps:
      value: 46
      status: evidence
      source: openf1_monza_2025
      note: >-
        Not stated by Ruth. Longest medium (C4) stint at Monza 2025 (Norris, 46 laps), the
        same compound designation as 2026. Matters for Strategy B through Ruth's Safety-Car rule: it decides
        when a medium fitted under a Safety Car can reach the flag.
  SOFT:
    offset_s: {value: -0.35, status: published, source: ruth_article, note: "'soft 0.35s ... quicker than the hard when new'."}
    deg_s_per_lap: {value: 0.10, status: published, source: ruth_article, note: "'soft 0.10 s/lap'."}
    warmup_s: {value: 0.0, status: assumed, source: ruth_article, note: "Ruth states a warm-up penalty for the hard only."}
    max_life_laps:
      value: 9
      status: evidence
      source: openf1_monza_2025
      note: "Longest soft (C5) stint at Monza 2025. Not used by any baseline strategy."
  warmup_policy:
    value: first_green_lap
    status: assumed
    source: none
    note: >-
      The hard's 0.6 s warm-up is paid on the first GREEN-flag lap driven on a newly fitted set: a lap that
      STARTS at racing speed on the shared race clock (before the deployment or after the restart). A set fitted
      just before or during a Safety Car is driven only at queue speed, which does not bring a hard tyre up to
      racing temperature, so its warm-up is deferred to the restart. A lap cut by the deployment pays the warm-up
      on its racing part and consumes it. Alternative 'first_lap_of_stint' tested as a sensitivity.
  warmup_at_race_start:
    value: false
    status: assumed
    source: none
    note: >-
      The formation lap brings a starting set up to temperature, so the hard warm-up
      penalty is applied only on the out-lap after a pit stop.
  starting_sets_new:
    value: true
    status: assumed
    role: fixed
    source: none
    note: >-
      All cars start on new tyres (age 0); Ruth gives no used-set information. FIXED: the loader rejects any
      other value (no used-set model is implemented).

pit:
  loss_green_s:
    value: 22.0
    status: published
    source: ruth_article
    note: "'pit loss 22s'. Consistent with TUM Monza (2.75 in-lap + 17.84 out-lap + ~2 s standstill)."
  loss_safety_car_s:
    value: 11.0
    status: published
    source: ruth_article
    note: "'(11s under a safety car)'. Charged when the car reaches the end of its in-lap while the Safety Car is out."

traffic:
  dirty_air_window_s:
    value: 2.0
    status: published
    source: ruth_article
    note: "'within 2s of the car ahead'. Measured on the start-of-lap gap."
  dirty_air_penalty_s:
    value: 0.25
    status: published
    source: ruth_article
    note: "'a quarter of a second a lap'."
  pass_window_s:
    value: 1.2
    status: published
    source: ruth_article
    note: "'within 1.2s'."
  pass_proximity_measure:
    value: any_point_in_lap
    status: assumed
    source: none
    note: >-
      The attacker counts as 'within 1.2 s' if it is within range at some point during
      the lap, i.e. min(start-of-lap gap, projected end-of-lap gap) <= 1.2 s. The alternative
      'start_of_lap' is implemented but not used in the reported experiments.
  pass_min_advantage_s:
    value: 0.35
    status: published
    source: ruth_article
    note: "'at least 0.35 s/lap faster'."
  pass_advantage_basis:
    value: intrinsic
    status: assumed
    source: none
    note: >-
      'Faster' compares the two cars' intrinsic clean-air lap times this lap (driver
      pace + tyre + fuel), not traffic-affected lap times. Alternative 'actual' (attacker's
      dirty-air lap vs the car ahead's realised lap) tested as a sensitivity.
  pass_resolution:
    value: time_crossing
    status: assumed
    source: heilmeier_2018
    note: >-
      A car that satisfies Ruth's passing condition is not held up; it takes the position only when its own
      elapsed time is earlier than the other car's, as in Heilmeier et al. (race-time comparison). No time is
      created or transferred, so every order change is time-feasible. A car that does not satisfy the condition
      'sits at the pace of the car ahead' at the minimum gap. With time feasibility the 1.2 s window is implied
      (a car that crosses during the lap was necessarily within 1.2 s). The instant-pass readings
      ('passed_car_yields', 'passer_jumps') are tested as sensitivities.
  duel_loss_attacker_s:
    value: 0.0
    status: assumed
    source: ruth_article
    note: >-
      Ruth's model states no duel time loss; zero for both cars keeps the costs symmetric. TUM's Monza values
      (0.3 s each, +0.3 s for the passed car) are a sensitivity.
  duel_loss_defender_s:
    value: 0.0
    status: assumed
    source: ruth_article
    note: "See duel_loss_attacker_s."
  min_follow_gap_s:
    value: 0.5
    status: evidence
    source: tum_monza_params
    note: >-
      Closest a car can sit behind another at the line when it cannot pass ('it sits at
      the pace of the car ahead'). TUM fitted value for Monza 2014-2019 (min_t_dist). Also the spacing of the
      queue at the restart (the same distance as the 0.8 s queue gap at Safety-Car pace).
  decision_tolerance_s:
    value: 1.0e-9
    status: assumed
    source: none
    note: "Floating-point tolerance so that an advantage of exactly 0.35 s counts as 'at least 0.35'."

start:
  grid_slot_gap_s:
    value: 0.117
    status: assumed
    source: tum_monza_params
    note: >-
      ASSUMED conversion. TUM's 0.117 s (mean of t_loss_pergridpos, Monza 2014-2019) is a first-lap TIME LOSS
      per grid position added to lap 1; here it is used as the elapsed-time HEADWAY at the start line. The two
      are equivalent only without lap-1 interactions. The resulting end-of-lap-1 spread of the grid cars is
      checked against Monza 2023-2025 timing (notebook section 7). Validated to be >= 0. TUM's own form is
      available separately (grid_lap1_loss_per_slot_s) as a sensitivity; the two must not both be used at full
      size (that would double-count the grid effect).
  pit_lane_start_gap_s:
    value: 6.0
    status: published
    source: ruth_article
    note: >-
      'Pit lane starters begin six seconds behind P22': the pit-lane RELEASE DELAY after the last grid slot.
      Validated to be >= 0 (a pit-lane starter cannot be released before the last grid car has passed).
      Not validated against data: there was no pit-lane starter at Monza 2023-2025. Isolated in sensitivity
      experiments (changing only Antonelli's release delay).
  grid_lap1_loss_per_slot_s:
    value: 0.0
    status: assumed
    source: tum_monza_params
    note: >-
      TUM's representation of the grid-position effect: a lap-1 TIME LOSS of this many seconds per grid slot
      behind P1 (TUM fit 0.117 s), added to lap 1 like dirty air (it does not count as being 'slower' in the
      passing rule). A pit-lane starter pays the loss of slot 22. Zero in the baseline, which represents the
      same effect as a starting headway (grid_slot_gap_s); used only in the start-model sensitivity.
  pit_lane_starter_slot_left_empty:
    value: true
    status: evidence
    role: fixed
    source: fia_sporting_2026
    note: >-
      Antonelli's slot (P20) is left empty; Albon and Lawson keep P21/P22 (the article's
      published grid is used unchanged). FIXED: the loader rejects 'false' (closing the gap is not
      implemented).

safety_car:
  model:
    value: global_timeline
    status: assumed
    source: tum_monza_params
    role: fixed
    note: >-
      The Safety-Car period is a window [t_d, t_r) of the shared race clock. t_d = the instant the leader
      completes lap N; t_r = t_d + 3 x 134.4 s (the Safety Car's own three laps). Every car-lap is cut at t_d and
      t_r: racing pace outside the window, the full-course-yellow pace inside it; no car completes lap N+j before
      the Safety Car; no overtaking while neutralised or before the line after the restart; queue spacing at the
      line from the first lap started behind the Safety Car; all cars released together at t_r; stops priced by
      the race time at which the in-lap ends. FIXED: the only implemented Safety-Car model.
  eligibility:
    value: every_cheap_lap
    status: assumed
    source: ruth_article
    note: >-
      Ruth's rule ('anyone yet to stop takes the cheap one if their next compound can reach the flag') is checked
      at EVERY line crossing of the car inside the Safety-Car window (whatever its lap number); the car stops at
      the first opportunity at which it is eligible. Alternative 'deployment_lap_only' (only the car's first line
      crossing inside the window) tested as a sensitivity.
  duration_laps:
    value: 3
    status: published
    source: ruth_article
    note: "'A safety car bunches the field for three laps'. Three laps of the Safety Car itself (t_r - t_d = 3 x 134.4 s)."
  deployment_instant:
    value: leader_completes_lap_N
    status: assumed
    role: fixed
    source: none
    note: >-
      'SC lap N' = the Safety Car is deployed as the leader completes lap N; the engine computes t_d as the time
      at which the first car completes lap N. FIXED: the only implemented definition.
  deployment_remainder_pace:
    value: fcy_lap
    status: assumed
    source: tum_monza_params
    note: >-
      The part of a lap still to be driven at the deployment instant is covered at the full-course-yellow pace
      L_fcy = 1.4 x 84 = 117.6 s/lap, the same for every car. The alternative 'own_lap_scaled' (1.4 x the car's
      own remaining racing time) is tested as a sensitivity.
  queue_gap_s:
    value: 0.8
    status: evidence
    source: tum_monza_params
    note: >-
      Gap at which a car follows the car ahead once it has reached the Safety-Car queue (TUM min_t_dist_sc).
      FIA B5.13.2b allows at most ten car lengths. Treated as a DISTANCE: 0.8 s at Safety-Car pace is the same
      spacing as the 0.5 s minimum gap at racing pace (0.8 / 134.4 = 0.5 / 84 lap). At the line a car keeps the
      time the car ahead needs to cover that spacing: 0.8 s while neutralised, 0.5 s at racing pace, continuous
      across deployment and restart.
  opportunistic_stops:
    value: true
    status: published
    source: ruth_article
    note: >-
      'anyone yet to stop takes the cheap one if their next compound can reach the flag'.
      Cars that have already made their stop do not stop again.

field:
  start_compound: {value: MEDIUM, status: published, source: ruth_article, note: "'The rest of the field runs medium to hard'."}
  second_compound: {value: HARD, status: published, source: ruth_article, note: "'medium to hard'."}
  pit_window_laps: {value: [14, 24], status: published, source: ruth_article, note: "'stopping between laps 14 and 24'."}
  pit_lap_assignment:
    value: grid_linear
    status: assumed
    source: ruth_article
    note: >-
      'with the leaders latest': in-laps interpolated linearly by starting-grid order from
      lap 24 (P1) to lap 14 (last car on the grid), rounded half-up. Alternatives (pace
      order, uniform lap, reversed, random within the window) are sensitivity experiments.

antonelli:
  pit_lane_start: {value: true, status: published, source: ruth_article, note: "'which is the version I've modelled below'."}
  strategies:
    A:
      label: "Box lap 1, hard to the flag"
      start_compound: {value: MEDIUM, status: assumed, source: fia_sporting_2026, note: "Not stated by Ruth. Must differ from HARD (FIA B6.3.6 two-specification rule); medium is the field's start tyre. Soft tested as a sensitivity."}
      stops: {value: [[1, HARD]], status: published, source: ruth_article, note: "'box at the end of lap 1, take the hard, and drive to the flag'."}
    B:
      label: "Start hard, medium at lap 36"
      start_compound: {value: HARD, status: published, source: ruth_article, note: "'Start hard, go long'."}
      stops: {value: [[36, MEDIUM]], status: published, source: ruth_article, note: "'medium at lap 36' (in-lap 36). In-lap 35 tested as a sensitivity."}
    C:
      label: "Conventional: medium, stop lap 20, hard"
      start_compound: {value: MEDIUM, status: published, source: ruth_article, note: "'Conventional medium, stop lap 20, hard'."}
      stops: {value: [[20, HARD]], status: published, source: ruth_article, note: "In-lap 20."}

pace:
  long_run_filter:
    value: symmetric_2pct_green_only
    status: published
    role: fixed
    source: ruth_article
    note: >-
      'Clean laps are within two per cent of the stint median', implemented literally (|t - median| <= 2%), with
      out/in laps and non-green (TrackStatus != 1) laps removed. Selects exactly the same runs as the one-sided
      reading (t <= 1.02 median), verified in the notebook. FIXED: the notebook's pace pipeline implements
      exactly this filter, and the loader rejects any other value.
  bearman_exception:
    value: source_matching
    status: assumed
    role: fixed
    source: ruth_article
    note: >-
      Ruth's chart lists Bearman as having no FP2 long run although the literal filter finds a 6-clean-lap run.
      The published values are used for the reconstruction (a source-matching exception); the independent
      extraction including Bearman is reported separately. FIXED: validated by the loader; the notebook applies
      exactly this exception.
  baseline_set:
    value: friday_weighted
    status: assumed
    source: ruth_article
    note: >-
      Ruth's model uses 'pace per driver as above' but the article gives two readings.
      The Friday-weighted set is the only complete 22-driver set she published and the one
      plotted beside the Antonelli analysis, so it is the baseline. The Saturday-rebased
      set (10 published + 12 reconstructed) and a 50/50 blend are pre-registered alternatives.
  alternative_sets:
    value: [saturday_rebased, blend_50_50]
    status: assumed
    source: none
    note: >-
      Specified together with the baseline, before any comparison with Ruth's results. The notebook runs
      exactly these sets as the pre-registered alternatives (names validated by the loader); every other pace
      set is labelled as an additional, not pre-registered sensitivity.

scenarios:
  safety_car_laps:
    value: [null, 1, 5, 20, 35]
    status: published
    source: ruth_article
    note: "No safety car, and a safety car on lap 1, 5, 20 or 35."

sources:
  ruth_article: "Ruth Buscombe, 'The best strategy depends on who you are', The Race Strategy Society (Substack), Monza 2026 race briefing. https://ruthbuscombe.substack.com/p/the-best-strategy-depends-on-who"
  heilmeier_2018: "A. Heilmeier, M. Graf, M. Lienkamp, 'A Race Simulation for Strategy Decisions in Circuit Motorsports', IEEE ITSC 2018, doi:10.1109/ITSC.2018.8570012"
  tum_monza_params: "TUMFTM/race-simulation (LGPL-3.0), racesim/input/parameters/pars_Monza_2014..2019.ini, commit 96ef2c2. https://github.com/TUMFTM/race-simulation"
  fia_sporting_2026: "FIA 2026 F1 Regulations, Section B Sporting, Issue 07 (25 June 2026): B5.3 Pit Lane Starters, B5.13 Safety Car, B6.3.6 tyre specifications."
  openf1_monza_2025: "OpenF1 API, 2025 Italian GP race stints (session_key 9912). https://api.openf1.org/v1/stints?session_key=9912"
  fastf1_2026_timing: "Official F1 live-timing data via FastF1 3.8.3: 2026 Italian GP FP2 laps and qualifying results."
  none: "No external source - modelling choice documented in the note."
